name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regression:
    name: Host regressions and Linux engine
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl2-dev zlib1g-dev python3
      - name: Configure assertion-enabled host tests
        run: cmake -S . -B out/regression -DCMAKE_BUILD_TYPE=Debug -DFALLOUT_VENDORED=OFF
      - name: Build regression executables
        run: cmake --build out/regression --target regression_tests --parallel 2
      - name: Run regressions
        run: ctest --test-dir out/regression --verbose --no-tests=error
      - name: Build Linux engine and resource tool
        run: cmake --build out/regression --target fallout2-ce ce-dat-tool --parallel 2
      - name: Generate ce.dat locally
        run: |
          mkdir -p out/dist
          out/regression/ce-dat-tool create files/ce.dat out/dist/ce.dat
          test -s out/dist/ce.dat

  ios:
    name: iOS

    runs-on: macos-14

    steps:
      - name: Clone
        uses: actions/checkout@v4

      # Configure from fresh dependencies; do not restore patched source or
      # generated Xcode projects from a fixed whole-build-tree cache.
      # Unsigned: the build only checks it compiles (signing needs a team).
      - name: Configure
        run: |
          cmake --preset ios -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build
        run: |
          cmake --build --preset ios-debug

      - name: Pack
        run: |
          cd out/build/ios
          cpack -C Debug

  android:
    name: Android

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: os/android/app/.cxx
          key: android-cmake-v101

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleDebug
